services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-wms}
      POSTGRES_USER: ${POSTGRES_USER:-wms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - wms_postgres:/var/lib/postgresql/data
    # Reachable only from this machine (for SQL tools), never from the internet.
    ports:
      - "127.0.0.1:5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [private]

  wms-api:
    build: ./api
    restart: unless-stopped
    environment:
      WMS_ADDR: 0.0.0.0:8080
      DATABASE_URL: postgres://${POSTGRES_USER:-wms}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-wms}?sslmode=disable
      WMS_ALLOWED_ORIGINS: https://${WMS_DOMAIN}
      SMS_WMS_INGEST_TOKEN: ${SMS_WMS_INGEST_TOKEN:?Set SMS_WMS_INGEST_TOKEN in .env}
      SMS_SHIPMENT_UPDATE_URL: ${SMS_SHIPMENT_UPDATE_URL:-}
      SMS_SHIPMENT_UPDATE_TOKEN: ${SMS_SHIPMENT_UPDATE_TOKEN:-}
      SMS_INVENTORY_SYNC_URL: ${SMS_INVENTORY_SYNC_URL:-}
      SMS_INVENTORY_SYNC_TOKEN: ${SMS_INVENTORY_SYNC_TOKEN:-}
      ORDER_SYNC_URL: ${ORDER_SYNC_URL:-}
      ORDER_SYNC_AUTHORIZATION: ${ORDER_SYNC_AUTHORIZATION:-}
      ORDER_SYNC_INTERVAL: ${ORDER_SYNC_INTERVAL:-5m}
      ORDER_SYNC_IMPORT_STATUSES: ${ORDER_SYNC_IMPORT_STATUSES:-PAID}
      ORDER_SYNC_STOCKIST: ${ORDER_SYNC_STOCKIST:-}
      EASYPARCEL_CLIENT_ID: ${EASYPARCEL_CLIENT_ID:-}
      EASYPARCEL_CLIENT_SECRET: ${EASYPARCEL_CLIENT_SECRET:-}
      EASYPARCEL_ENVIRONMENT: ${EASYPARCEL_ENVIRONMENT:-unknown}
      EASYPARCEL_REDIRECT_URI: https://${WMS_DOMAIN}/api/easyparcel/callback
      EASYPARCEL_WEBHOOK_TOKEN: ${EASYPARCEL_WEBHOOK_TOKEN:-}
      WMS_TOKEN_ENCRYPTION_KEY: ${WMS_TOKEN_ENCRYPTION_KEY:-}
      EASYPARCEL_COOKIE_SECURE: ${EASYPARCEL_COOKIE_SECURE:-true}
      EASYPARCEL_API_VERSION: ${EASYPARCEL_API_VERSION:-2026-09}
      WMS_COOKIE_SECURE: ${WMS_COOKIE_SECURE:-true}
      WMS_ALLOW_DEV_ORIGINS: ${WMS_ALLOW_DEV_ORIGINS:-false}
      WAREHOUSE_SENDER_NAME: ${WAREHOUSE_SENDER_NAME:-}
      WAREHOUSE_SENDER_PHONE_COUNTRY: ${WAREHOUSE_SENDER_PHONE_COUNTRY:-60}
      WAREHOUSE_SENDER_PHONE: ${WAREHOUSE_SENDER_PHONE:-}
      WAREHOUSE_SENDER_EMAIL: ${WAREHOUSE_SENDER_EMAIL:-}
      WAREHOUSE_SENDER_ADDRESS_1: ${WAREHOUSE_SENDER_ADDRESS_1:-}
      WAREHOUSE_SENDER_ADDRESS_2: ${WAREHOUSE_SENDER_ADDRESS_2:-}
      WAREHOUSE_SENDER_POSTCODE: ${WAREHOUSE_SENDER_POSTCODE:-}
      WAREHOUSE_SENDER_CITY: ${WAREHOUSE_SENDER_CITY:-}
      WAREHOUSE_SENDER_STATE: ${WAREHOUSE_SENDER_STATE:-}
    depends_on:
      db:
        condition: service_healthy
    networks: [private, egress]

  wms-web:
    build:
      context: ./web
      args:
        VITE_API_BASE_URL: ""
        VITE_WMS_API_ENABLED: ${VITE_WMS_API_ENABLED:-false}
        VITE_WMS_COURIERS: ${VITE_WMS_COURIERS:-[]}
        VITE_WMS_READ_ONLY_PREVIEW: ${VITE_WMS_READ_ONLY_PREVIEW:-false}
        VITE_WMS_EASYPARCEL_CONNECT: ${VITE_WMS_EASYPARCEL_CONNECT:-false}
    restart: unless-stopped
    volumes:
      - ./web/dist:/usr/share/nginx/html:ro
    networks: [private]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      WMS_DOMAIN: ${WMS_DOMAIN:?Set WMS_DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [wms-web, wms-api]
    networks: [private, egress]

volumes:
  wms_postgres:
  caddy_data:
  caddy_config:

networks:
  private:
    internal: false
  egress: {}
